name: Go package manager

on:
  push:
    branches: [main, codex/go-pm-port]
    paths: ['pm-go/**', '.github/workflows/pm-go.yml']
  pull_request:
    types: [labeled]
    branches: [main]
    paths: ['pm-go/**', '.github/workflows/pm-go.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pm-go-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pm-go
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -o ../target/pm-go/ ./cmd/nub-pm-go
