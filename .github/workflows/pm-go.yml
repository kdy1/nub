name: Go package manager

on:
  push:
    branches: [main, codex/go-pm-port]
    paths: ['pm-go/**', '.github/workflows/pm-go.yml', '.gitattributes']
  pull_request:
    types: [labeled]
    branches: [main]
    paths: ['pm-go/**', '.github/workflows/pm-go.yml', '.gitattributes']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: pm-go-test-${{ matrix.os }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pm-go
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: '1.3.14'
      - name: Install pinned package manager oracles
        run: npm install --prefix "$RUNNER_TEMP/pm-go-npm" npm@11.19.0 pnpm@10.15.1 yarn@1.22.22 @yarnpkg/cli-dist@4.18.0 --ignore-scripts --no-audit --no-fund
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Reference argument declarations
        run: python scripts/extract_surface.py --check
      - run: go vet ./...
      - run: go test -race ./...
        env:
          PM_SEMVER_ORACLE: '1'
          PM_NPM_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/npm/bin/npm-cli.js
          PM_PNPM_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/pnpm/bin/pnpm.cjs
          PM_YARN_CLASSIC_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/yarn/bin/yarn.js
          PM_YARN_BERRY_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/@yarnpkg/cli-dist/bin/yarn.js
          PM_BUN_BIN: ${{ steps.bun.outputs.bun-path }}
      - name: Build without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -o ../target/pm-go/ ./cmd/nub-pm-go

  parity:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    concurrency:
      group: pm-go-parity-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      NUB_ALLOW_INCOMPLETE_RUNTIME: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          cache: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: '1.3.14'
      - name: Install pinned package manager oracles
        run: npm install --prefix "$RUNNER_TEMP/pm-go-npm" npm@11.19.0 pnpm@10.15.1 yarn@1.22.22 @yarnpkg/cli-dist@4.18.0 --ignore-scripts --no-audit --no-fund
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: pm-go-reference
          cache-on-failure: true
      - name: Build Rust reference
        run: python3 pm-go/scripts/build_rust_oracle.py
      - name: Build Go executable
        working-directory: pm-go
        env:
          CGO_ENABLED: '0'
        run: go build -o ../target/pm-go/nub-pm-go ./cmd/nub-pm-go
      - name: Compare the same fixture in both executables
        working-directory: pm-go
        env:
          PM_RUST_BIN: ${{ github.workspace }}/target/fast/nub
          PM_GO_BIN: ${{ github.workspace }}/target/pm-go/nub-pm-go
        run: go test -v ./integration
      - name: Compare lockfile libraries and npm acceptance
        working-directory: pm-go
        env:
          PM_RUST_LOCKFILE_ORACLE: ${{ github.workspace }}/target/pm-go/rust-lockfile-oracle
          PM_NPM_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/npm/bin/npm-cli.js
          PM_PNPM_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/pnpm/bin/pnpm.cjs
          PM_YARN_CLASSIC_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/yarn/bin/yarn.js
          PM_YARN_BERRY_CLI: ${{ runner.temp }}/pm-go-npm/node_modules/@yarnpkg/cli-dist/bin/yarn.js
          PM_BUN_BIN: ${{ steps.bun.outputs.bun-path }}
        run: go test -v ./internal/lockfile ./internal/lockfile/npm ./internal/lockfile/pnpm ./internal/lockfile/bun ./internal/lockfile/yarn
